# posities.yaml — de munten die je ECHT gekocht hebt.
#
# De bot leest dit bestand en mailt zodra een niveau uit risk_config.yaml
# geraakt wordt. Hij koopt en verkoopt niets; hij herinnert je aan de regels
# die je zelf hebt opgeschreven toen je nog rustig keek.
#
# Vul per positie het contractadres in, plus je instapprijs OF de marketcap
# waarbij je instapte. Prijs is nauwkeuriger; marketcap is makkelijker af te
# lezen op DexScreener.
#
# Verkocht? Haal de regel weg of zet er een # voor.

posities: []

