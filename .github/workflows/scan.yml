name: scan

on:
  schedule:
    # Elke 20 minuten. GitHub's cron is niet exact — in de praktijk lag de
    # afstand tussen runs rond de 88 minuten. Een run duurt nu ~8 minuten door
    # de trage publieke Solana-server; met een eigen Helius-sleutel in
    # SOLANA_RPC_URL zakt dat naar 2-3 minuten en kun je naar */10.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draaien zonder mail te versturen"
        type: boolean
        default: false
      limit:
        description: "Max aantal kandidaten"
        type: string
        default: ""

# Twee runs tegelijk zouden elkaars logbestand overschrijven.
concurrency:
  group: memecoin-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Scan draaien
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUGCHECK_API_KEY: ${{ secrets.RUGCHECK_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          USD_PER_EUR: ${{ vars.USD_PER_EUR }}
          # Welke drempelset mag mailen. De andere drie lopen altijd mee in
          # het logboek. Leeg laten = set B.
          ACTIVE_SET: ${{ vars.ACTIVE_SET }}
          # Staat de repository-variable niet ingesteld, dan gaat de
          # narratief-check automatisch uit in plaats van de run af te breken.
          CLAUDE_META_CHECK_ENABLED: ${{ vars.CLAUDE_META_CHECK_ENABLED || 'false' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python main.py $ARGS

      - name: Log en state terugcommitten
        if: always()
        run: |
          git config user.name  "memecoin-alert-bot"
          git config user.email "actions@github.com"
          git add -A logs state
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi
          git commit -m "scan: log + state bijgewerkt [skip ci]"
          # Rebase-pull zodat een gelijktijdige followup-run niet botst.
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push poging $attempt mislukt, opnieuw..."
            sleep 5
          done
          echo "Kon log niet pushen na 3 pogingen." >&2
          exit 1

      # Het logboek wordt hierboven al naar git gecommit, mét volledige
      # historie. Het ook nog als artifact bewaren is pure duplicatie en
      # vreet je gratis artifact-opslag van 500 MB op.

      # De volledige API-antwoorden. BEWUST als artifact en niet in git: git
      # vergeet nooit iets, dus committen zou de repo onbeperkt laten groeien.
      #
      # Bewaartermijn 14 dagen. Dat is geen zuinigheid maar rekenwerk: ~170 KB
      # per run bij ~50 runs per dag is ~8,5 MB per dag, dus ~120 MB in beeld.
      # Ruim onder de 500 MB die je gratis hebt. Zet je dit op 90 dagen, dan
      # loop je binnen enkele weken tegen de quota aan en falen de uploads.
      #
      # Wil je een archief langer bewaren: download het en zet het ergens
      # anders neer.
      - name: Ruw archief als artifact bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw/
          if-no-files-found: ignore
          retention-days: 14
